version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/LittleHelpers.Web"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    ignore:
      - dependency-name: "typescript"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/docs/compose"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      github-actions:
        patterns: ["*"]
