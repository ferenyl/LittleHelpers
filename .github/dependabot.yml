version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      nuget:
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/LittleHelpers.Web"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    ignore:
      - dependency-name: "typescript"
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/docs/compose"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      docker-compose:
        patterns: ["*"]
      docker-compose-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
